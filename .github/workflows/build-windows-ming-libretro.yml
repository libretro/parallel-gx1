name: Build parallel_gamecubewii (libretro) for Windows (MinGW on Ubuntu)

on: [push, pull_request]

env:
  core_id: parallel_gamecubewii_libretro

jobs:
  build:
    runs-on: ubuntu-latest
    container: ubuntu:25.10
    steps:
    - name: Install dependencies
      run: |
        apt update
        apt install -y git make mingw-w64

    - name: Checkout parallel-gamecubewii repo
      uses: actions/checkout@v6
      with:
        path: ${{ env.core_id }}
        submodules: recursive

    - name: Build
      run: |
        cd ${{ env.core_id }}
        make -j$(nproc) CC=x86_64-w64-mingw32-gcc-posix CXX=x86_64-w64-mingw32-g++-posix
