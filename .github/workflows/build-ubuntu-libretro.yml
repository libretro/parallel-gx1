name: Build parallel_gamecubewii (libretro) on Ubuntu x64

on: [push, pull_request]

env:
  core_id: parallel_gamecubewii_libretro

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout parallel-gamecubewii repo
      uses: actions/checkout@v6
      with:
        path: ${{ env.core_id }}
        submodules: recursive

    - name: Build
      run: |
        cd ${{ env.core_id }}
        make -j$(nproc)
