name: Build parallel_gamecubewii (libretro) on Android

on: [push, pull_request]

env:
  core_id: parallel_gamecubewii_libretro

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Install dependencies
      run: |
        wget https://dl.google.com/android/repository/android-ndk-r29-linux.zip
        unzip -q android-ndk-r29-linux.zip
        echo "ANDROID_NDK_HOME=$PWD/android-ndk-r29" >> $GITHUB_ENV

    - name: Checkout parallel-gamecubewii repo
      uses: actions/checkout@v6
      with:
        path: ${{ env.core_id }}
        submodules: recursive

    - name: Build
      run: |
        cd ${{ env.core_id }}
        make -j$(nproc) platform=android-arm64 NDK_ROOT=$ANDROID_NDK_HOME
